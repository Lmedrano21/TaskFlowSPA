<!--
  VISTA TASKS (Listado de Tickets)
  
  Página que muestra todas las tickets del usuario autenticado.
  Permite crear, editar, eliminar y marcar tickets como completadas.
  
  Componentes:
  - Encabezado con botón "Crear Ticket"
  - Contenedor dinámico para listado de tickets
  - Cada ticket: título, descripción, botones de acciones
  
  Nota: Las tickets se cargan dinámicamente desde la API mediante JavaScript
-->
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mis tickets | TicketFlowSPA</title>
  </head>
  <body class="min-h-screen bg-sky-50 text-slate-800">
    <main class="mx-auto max-w-6xl px-6 py-10">
      <!-- ENCABEZADO CON BOTÓN CREAR -->
      <section class="flex flex-col gap-4 rounded-[2rem] bg-blue-600 px-8 py-10 text-white md:flex-row md:items-end md:justify-between">
        <div>
          <p class="text-sm font-semibold uppercase tracking-[0.3em] text-blue-100">CRUD de tickets</p>
          <h1 class="mt-3 text-4xl font-black tracking-tight">Mis tickets</h1>
          <p class="mt-4 max-w-2xl text-blue-50">Vista principal para listar, editar y eliminar las tickets del usuario autenticado.</p>
        </div>
        <!-- Botón Crear Ticket -->
        <a class="inline-flex items-center justify-center rounded-2xl bg-white px-5 py-3 text-sm font-bold text-blue-700 hover:bg-blue-50" href="/task-form" data-link>
          Crear ticket
        </a>
      </section>

      <!-- CONTENEDOR DE TAREAS (Dinámico - se llena con JavaScript) -->
      <section id="tasks-container" class="mt-8 grid gap-4">
        <!-- Las tickets se renderizarán aquí por JavaScript -->
        <div class="flex items-center justify-center py-8">
          <p class="text-slate-500">Cargando tickets...</p>
        </div>
      </section>
    </main>

    <!-- Script principal de la aplicación -->
    <script type="module" src="../main.js"></script>
  </body>
</html>
