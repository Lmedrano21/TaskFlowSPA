<!--
  VISTA TICKET-FORM (Formulario de Tickets)
  
  Formulario para crear nuevos tickets o editar tickets existentes.
  El título y botón cambian según sea creación o edición.
  
  Campos:
  - Título (requerido): Tema del ticket
  - Descripción (opcional): Detalles adicionales
  - Prioridad: Selector de nivel (Alta, Media, Baja)
  
  Nota: El formulario se adapta dinámicamente mediante JavaScript
-->
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario de Ticket | TicketFlowSPA</title>
  </head>
  <body class="min-h-screen bg-sky-50 text-slate-800">
    <main class="mx-auto max-w-4xl px-6 py-10">
      <!-- ENCABEZADO -->
      <section class="rounded-[2rem] bg-blue-600 px-8 py-10 text-white">
        <p class="text-sm font-semibold uppercase tracking-[0.3em] text-blue-100">Formulario</p>
        <h1 id="form-title" class="mt-3 text-4xl font-black tracking-tight">Crear Nuevo Ticket</h1>
        <p class="mt-4 max-w-2xl text-blue-50">Completa los detalles del ticket. Incluyendo título, descripción y nivel de prioridad.</p>
      </section>

      <!-- FORMULARIO -->
      <section class="mt-8 rounded-3xl border border-blue-100 bg-white p-8 shadow-lg shadow-blue-50">
        <form id="ticket-form" class="space-y-6">
          <!-- Campo: Título -->
          <div>
            <label for="ticket-title" class="block text-sm font-semibold text-slate-900">
              Título del Ticket
              <span class="text-red-600">*</span>
            </label>
            <input
              id="ticket-title"
              type="text"
              placeholder="Ej: Error al descargar archivos"
              required
              class="mt-2 w-full rounded-2xl border border-blue-200 bg-white px-4 py-2 text-sm text-slate-900 outline-none transition-colors placeholder:text-slate-400 hover:border-blue-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
            />
            <p class="mt-1 text-xs text-slate-500">Descripción breve y clara del problema</p>
          </div>

          <!-- Campo: Descripción -->
          <div>
            <label for="ticket-description" class="block text-sm font-semibold text-slate-900">
              Descripción Detallada
            </label>
            <textarea
              id="ticket-description"
              placeholder="Explica el problema en detalle..."
              rows="5"
              class="mt-2 w-full resize-none rounded-2xl border border-blue-200 bg-white px-4 py-2 text-sm text-slate-900 outline-none transition-colors placeholder:text-slate-400 hover:border-blue-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
            ></textarea>
            <p class="mt-1 text-xs text-slate-500">Información adicional que ayude a resolver el problema</p>
          </div>

          <!-- Campo: Prioridad -->
          <div>
            <label for="ticket-priority" class="block text-sm font-semibold text-slate-900">
              Nivel de Prioridad
            </label>
            <select
              id="ticket-priority"
              class="mt-2 w-full rounded-2xl border border-blue-200 bg-white px-4 py-2 text-sm text-slate-900 outline-none transition-colors hover:border-blue-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
            >
              <option value="low">Baja</option>
              <option value="medium" selected>Media</option>
              <option value="high">Alta</option>
            </select>
            <p class="mt-1 text-xs text-slate-500">Selecciona la urgencia del ticket</p>
          </div>

          <!-- Botones de acción -->
          <div class="flex gap-3 pt-6">
            <!-- Botón: Enviar -->
            <button
              id="submit-btn"
              type="submit"
              class="flex-1 rounded-2xl bg-blue-600 px-5 py-3 text-sm font-bold text-white hover:bg-blue-500 transition-colors"
            >
              Crear Ticket
            </button>
            <!-- Botón: Cancelar -->
            <a
              href="/tickets"
              data-link
              class="flex-1 rounded-2xl border border-blue-200 bg-white px-5 py-3 text-center text-sm font-bold text-blue-700 hover:bg-blue-50 transition-colors"
            >
              Cancelar
            </a>
          </div>
        </form>
      </section>
    </main>

    <!-- Script principal de la aplicación -->
    <script type="module" src="../main.js"></script>
  </body>
</html>
