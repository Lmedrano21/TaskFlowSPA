<!-- 
    Vista de Panel Administrativo
    
    Panel exclusivo para usuarios con rol ADMIN que permite:
    - Crear nuevos técnicos
    - Ver lista de técnicos del sistema
    - Eliminar técnicos
    - Ver todos los tickets del sistema
    - Gestionar asignaciones de tickets
    
    Nota: Esta página está protegida por guards de ruta.
    Los usuarios sin rol ADMIN serán redirigidos automáticamente.
-->
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel Admin | TicketFlowSPA</title>
  </head>
  <body class="min-h-screen bg-sky-50 text-slate-800">
    <!-- Contenedor principal -->
    <main class="mx-auto max-w-7xl px-6 py-10">
      <!-- Encabezado con controles -->
      <section class="rounded-[2rem] bg-gradient-to-r from-blue-600 to-blue-700 px-8 py-10 text-white">
        <div class="flex flex-col gap-4 md:flex-row md:items-end md:justify-between">
          <div>
            <p class="text-sm font-semibold uppercase tracking-[0.3em] text-blue-100">Administración de Soporte</p>
            <h1 class="mt-3 text-4xl font-black tracking-tight">Panel de Control</h1>
            <p class="mt-4 max-w-2xl text-blue-50">
              Crea técnicos, gestiona usuarios y visualiza todos los tickets del sistema.
            </p>
          </div>
        </div>
      </section>

      <!-- Sección de gestión de técnicos -->
      <section class="mt-8 rounded-[2rem] border border-blue-100 bg-white p-8 shadow-xl shadow-blue-100/70">
        <div class="flex items-center justify-between">
          <h2 class="text-2xl font-bold text-slate-900">Gestión de Técnicos</h2>
          <button id="create-tech-btn" type="button" class="rounded-2xl bg-blue-600 px-6 py-3 text-sm font-bold text-white hover:bg-blue-500 transition-colors">
            + Crear Técnico
          </button>
        </div>

        <!-- Contenedor de técnicos -->
        <div id="technicians-container" class="mt-6">
          <div class="flex items-center justify-center py-8">
            <p class="text-slate-500">Cargando técnicos...</p>
          </div>
        </div>
      </section>

      <!-- Sección de tickets globales -->
      <section class="mt-8 rounded-[2rem] border border-blue-100 bg-white p-8 shadow-xl shadow-blue-100/70">
        <h2 class="text-2xl font-bold text-slate-900">Todos los Tickets del Sistema</h2>
        <p class="mt-2 text-sm text-slate-600">
          Vista de todos los tickets creados, independientemente del usuario.
        </p>

        <!-- Contenedor de tickets -->
        <div id="all-tickets-container" class="mt-6 grid gap-4">
          <div class="flex items-center justify-center py-8">
            <p class="text-slate-500">Cargando tickets...</p>
          </div>
        </div>
      </section>
    </main>

    <!-- Script del módulo -->
    <script type="module" src="../main.js"></script>
  </body>
</html>
