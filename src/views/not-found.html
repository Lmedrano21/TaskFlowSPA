<!--
  VISTA 404 (Página No Encontrada)
  
  Se muestra cuando el usuario intenta acceder a una ruta que no existe.
  Proporciona opciones para volver a rutas válidas.
  
  Características:
  - Mensaje informativo
  - Botones para navegar a Home o Login
-->
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 | TicketFlowSPA</title>
  </head>
  <body class="min-h-screen bg-gradient-to-b from-sky-50 via-white to-blue-100 text-slate-800">
    <main class="flex min-h-screen items-center justify-center px-6 py-10">
      <section class="w-full max-w-2xl rounded-[2rem] border border-blue-100 bg-white p-10 text-center shadow-xl shadow-blue-100/70">
        <!-- Etiqueta -->
        <p class="text-sm font-semibold uppercase tracking-[0.3em] text-blue-600">Error de navegacion</p>
        
        <!-- Código de error -->
        <h1 class="mt-4 text-6xl font-black tracking-tight text-slate-900">404</h1>
        
        <!-- Descripción -->
        <p class="mt-4 text-lg text-slate-600">La vista que intentas abrir no existe o todavia no esta disponible dentro del proyecto.</p>
        
        <!-- Botones de acción -->
        <div class="mt-8 flex flex-col justify-center gap-3 sm:flex-row">
          <!-- Botón: Ir a Home -->
          <a class="inline-flex items-center justify-center rounded-2xl bg-blue-600 px-5 py-3 text-sm font-bold text-white hover:bg-blue-500 transition-colors" href="/" data-link>Ir a home</a>
          
          <!-- Botón: Volver a Login -->
          <a class="inline-flex items-center justify-center rounded-2xl border border-blue-200 bg-white px-5 py-3 text-sm font-bold text-blue-700 hover:bg-blue-50 transition-colors" href="/login" data-link>Volver al login</a>
        </div>
      </section>
    </main>

    <!-- Script principal de la aplicación -->
    <script type="module" src="../main.js"></script>
  </body>
</html>
